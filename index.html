<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador Automatizado - Facebook Live</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #202024;
            --text-color: #e1e1e6;
            --primary: #1877f2; /* Azul Facebook */
            --success: #00b37e; /* Verde */
            --danger: #f75a68;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 5px;
            font-size: 24px;
        }

        p.subtitle {
            text-align: center;
            color: #a8a8b3;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #121214;
            border: 1px solid #323238;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 15px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background: #323238 !important;
            color: #7c7c8a;
            cursor: not-allowed;
        }

        #btnCapturar { background: var(--primary); }
        #btnSortear { background: var(--success); }

        .status-box {
            padding: 12px;
            border-radius: 6px;
            background: #29292e;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #323238;
        }

        #winnerCard {
            margin-top: 25px;
            padding: 20px;
            background: #29292e;
            border-radius: 6px;
            text-align: center;
            border: 2px dashed var(--success);
            display: none;
        }

        .winner-name {
            font-size: 28px;
            color: #fff;
            font-weight: bold;
            margin: 10px 0;
        }

        .winner-comment {
            font-style: italic;
            color: #a8a8b3;
        }

        /* Lista visual de participantes */
        .list-container {
            margin-top: 20px;
            max-height: 150px;
            overflow-y: auto;
            background: #121214;
            border-radius: 6px;
            padding: 10px;
            font-size: 13px;
        }

        .comment-item {
            padding: 6px;
            border-bottom: 1px solid #202024;
        }
        .comment-item:last-child { border: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎟️ Sorteador Automático de Live</h1>
    <p class="subtitle">Apenas para lives 100% públicas de Páginas do Facebook</p>
    
    <div class="input-group">
        <label for="liveUrl">Link da Live do Facebook:</label>
        <input type="text" id="liveUrl" placeholder="https://www.facebook.com/watch/live/?v=...">
    </div>

    <div class="actions">
        <button id="btnCapturar" onclick="puxarComentarios()">1. Buscar Comentários 🔄</button>
        <button id="btnSortear" onclick="realizarSorteio()" disabled>2. Sortear Ganhador 🎲</button>
    </div>

    <div id="status" class="status-box">Insira o link acima e clique em buscar.</div>

    <div id="winnerCard">
        <div style="color: var(--success); font-weight: bold; font-size: 18px;">🎉 PARABÉNS AO GANHADOR! 🎉</div>
        <div class="winner-name" id="winnerName">Nome</div>
        <div class="winner-comment" id="winnerComment">"Comentário"</div>
    </div>

    <div id="listaVisual" class="list-container" style="display: none;">
        <strong>Participantes carregados:</strong>
        <div id="listaItens"></div>
    </div>
</div>

<script>
    let participantes = [];

    async function puxarComentarios() {
        const url = document.getElementById('liveUrl').value.trim();
        const statusDiv = document.getElementById('status');
        const btnCapturar = document.getElementById('btnCapturar');
        const btnSortear = document.getElementById('btnSortear');
        const listaVisual = document.getElementById('listaVisual');
        const listaItens = document.getElementById('listaItens');

        if (!url) {
            alert('Por favor, cole o link da live!');
            return;
        }

        statusDiv.style.color = '#fff';
        statusDiv.innerText = "Conectando e raspando dados da live (isso pode demorar)...";
        btnCapturar.disabled = true;
        participantes = [];
        listaItens.innerHTML = "";
        listaVisual.style.display = "none";

        try {
            // Usa o proxy Allorigins para contornar o bloqueio de CORS do navegador
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
            const response = await fetch(proxyUrl);
            const data = await response.json();
            
            if (!data.contents) {
                throw new Error("Não foi possível ler a página.");
            }

            // Cria um documento virtual para ler o HTML recebido do Facebook
            const parser = new DOMParser();
            const doc = parser.parseFromString(data.contents, 'text/html');

            // Tenta buscar as estruturas de comentários padrões do Facebook (estruturas div[role="comment"] ou spans de texto)
            // Nota: O Facebook altera as classes frequentemente, por isso buscamos por atributos genéricos
            const blocosComentarios = doc.querySelectorAll('div[role="comment"], div[dir="auto"]');

            blocosComentarios.forEach((bloco, index) => {
                // Tentativa de extrair textos que pareçam comentários
                let texto = bloco.innerText.trim();
                
                // Filtro básico para simular dados se o Facebook bloquear a leitura estruturada em modo anônimo
                if (texto && texto.length > 2 && !texto.includes('Compartilhar') && !texto.includes('Curtir')) {
                    // Como o Scraper não traz os nomes separados perfeitamente sem API, dividimos ou simulamos o autor
                    participantes.push({
                        nome: `Participante #${index + 1}`,
                        comentario: texto.substring(0, 100)
                    });

                    // Adiciona na listagem da tela
                    const item = document.createElement('div');
                    item.className = 'comment-item';
                    item.innerHTML = `<strong>Participante #${index + 1}:</strong> ${texto.substring(0, 80)}`;
                    listaItens.appendChild(item);
                }
            });

            // CASO O FACEBOOK BLOQUEIE O SCRAPER (Muito comum por segurança)
            // Criamos uma simulação de segurança para que o código do seu GitHub não quebre na apresentação
            if (participantes.length === 0) {
                statusDiv.style.color = '#f75a68';
                statusDiv.innerHTML = "⚠️ O Facebook bloqueou o acesso direto ao link via robô.<br><small>Gerando dados de demonstração baseados na página para o sorteio funcionar:</small>";
                
                // Injeta participantes fictícios para o botão de sorteio funcionar no seu portfólio
                participantes = [
                    { nome: "Carlos Silva", comentario: "Quero ganhar muito!" },
                    { nome: "Mariana Souza", comentario: "Excelente live! #Sorteio" },
                    { nome: "Pedro Henrique", comentario: "Compartilhado e curtido!" },
                    { nome: "Ana Beatriz", comentario: "Eu quero o prêmio!" },
                    { nome: "Lucas Lima", comentario: "Top de mais a transmissão" }
                ];

                participantes.forEach(p => {
                    const item = document.createElement('div');
                    item.className = 'comment-item';
                    item.innerHTML = `<strong>${p.nome}:</strong> ${p.comentario}`;
                    listaItens.appendChild(item);
                });
            } else {
                statusDiv.style.color = '#00b37e';
                statusDiv.innerText = `Sucesso! ${participantes.length} comentários encontrados na página pública.`;
            }

            listaVisual.style.display = "block";
            btnSortear.disabled = false;

        } catch (error) {
            statusDiv.style.color = '#f75a68';
            statusDiv.innerText = "Erro ao conectar com a Live. Certifique-se de que o link está correto e a live é pública.";
            console.error(error);
        } finally {
            btnCapturar.disabled = false;
        }
    }

    function realizarSorteio() {
        if (participantes.length === 0) return;

        const btn = document.getElementById('btnSortear');
        const winnerCard = document.getElementById('winnerCard');
        const winnerName = document.getElementById('winnerName');
        const winnerComment = document.getElementById('winnerComment');

        btn.disabled = true;
        btn.innerText = "Sorteando...";
        winnerCard.style.display = 'none';

        // Efeito visual de roleta (roda os nomes rápido por 2 segundos)
        let fakesCount = 0;
        const interval = setInterval(() => {
            const randomFake = participantes[Math.floor(Math.random() * participantes.length)];
            winnerName.innerText = randomFake.nome;
            winnerComment.innerText = `"${randomFake.comentario}"`;
            winnerCard.style.display = 'block';
            fakesCount++;
            
            if (fakesCount > 20) {
                clearInterval(interval);
                
                // Escolha do ganhador oficial real
                const indexSorteado = Math.floor(Math.random() * participantes.length);
                const ganhador = participantes[indexSorteado];

                winnerName.innerText = ganhador.nome;
                winnerComment.innerText = `"${ganhador.comentario}"`;
                
                btn.disabled = false;
                btn.innerText = "2. Sortear Ganhador 🎲";
            }
        }, 100);
    }
</script>

</body>
</html>
