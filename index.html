<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Rádio Online</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        h1 { margin-bottom: 20px; }
        audio {
            margin-top: 20px;
            filter: invert(100%); /* Ajusta o player para combinar com o tema escuro */
        }
        .status {
            margin-top: 10px;
            font-size: 0.9em;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Minha Rádio 🎵</h1>
        <p>Ouça agora a melhor programação!</p>
        
        <audio controls autoplay>
            <source src="https://icecast.itv.com.br:8000/itv" type="audio/mpeg">
            Seu navegador não suporta o elemento de áudio.
        </audio>

        <div class="status">● Ao Vivo</div>
    </div>

</body>
</html>
